[project]
name = "soc-investigator"
version = "0.3.1"
description = "Local-first AI security investigation agent for Windows: security signals to evidence-grounded investigations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "httpx>=0.26",
    "jinja2>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
investigator = "investigator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["investigator", "investigator.llm", "investigator.backends", "investigator.evaluation"]

[tool.setuptools.package-data]
investigator = ["templates/*.html", "static/*.css", "static/*.js", "cases/*/*.json", "cases/*.md",
                "benchmarks/*/*/*.json", "benchmarks/*/*.md",
                "windows_samples/*/*.xml", "windows_samples/*/*.json", "windows_samples/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that require Ollama or a live Wazuh (deselected by default)"]
addopts = "-m 'not integration'"
